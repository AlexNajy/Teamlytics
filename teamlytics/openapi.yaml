openapi: 3.1.0
info:
  title: My FastAPI App
  version: 1.0.0
paths:
  /api/v1/tasks:
    get:
      summary: Get Tasks
      operationId: get_tasks_api_v1_tasks_get
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CompletedTask'
                type: array
                title: Response Get Tasks Api V1 Tasks Get
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskFailure'
    post:
      summary: Create Single Task
      operationId: create_single_task_api_v1_tasks_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletedTask'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskFailure'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskFailure'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tasks/{task_id}:
    delete:
      summary: Delete Single Task
      operationId: delete_single_task_api_v1_tasks__task_id__delete
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: integer
          title: Task Id
      responses:
        '204':
          description: Successful Response
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskFailure'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users:
    get:
      summary: Get Tasks
      operationId: get_tasks_api_v1_users_get
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CompletedUser'
                type: array
                title: Response Get Tasks Api V1 Users Get
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletedUser'
    post:
      summary: Create Single User
      operationId: create_single_user_api_v1_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletedUser'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletedUser'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/{user_id}:
    delete:
      summary: Delete Single User
      operationId: delete_single_user_api_v1_users__user_id__delete
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '204':
          description: Successful Response
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletedUser'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /:
    get:
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    CompletedTask:
      properties:
        id:
          type: integer
          title: Id
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
        status:
          $ref: '#/components/schemas/TaskStatusEnum'
        assignee:
          type: string
          title: Assignee
        estimated_time:
          type: string
          format: duration
          title: Estimated Time
        desired_completion_date:
          type: string
          format: date-time
          title: Desired Completion Date
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        timestamp:
          type: string
          format: date-time
          title: Timestamp
      type: object
      required:
      - id
      - title
      - description
      - status
      - assignee
      - estimated_time
      - desired_completion_date
      - timestamp
      title: CompletedTask
    CompletedUser:
      properties:
        id:
          type: integer
          title: Id
        role:
          type: string
          title: Role
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
        context_field:
          type: string
          title: Context Field
        current_task:
          anyOf:
          - $ref: '#/components/schemas/TaskId'
          - type: 'null'
        queued_task:
          items:
            $ref: '#/components/schemas/TaskId'
          type: array
          title: Queued Task
        timestamp:
          type: string
          format: date-time
          title: Timestamp
      type: object
      required:
      - id
      - role
      - first_name
      - last_name
      - context_field
      - current_task
      - queued_task
      - timestamp
      title: CompletedUser
    HTTPStatus:
      type: integer
      enum:
      - 100
      - 101
      - 102
      - 103
      - 200
      - 201
      - 202
      - 203
      - 204
      - 205
      - 206
      - 207
      - 208
      - 226
      - 300
      - 301
      - 302
      - 303
      - 304
      - 305
      - 307
      - 308
      - 400
      - 401
      - 402
      - 403
      - 404
      - 405
      - 406
      - 407
      - 408
      - 409
      - 410
      - 411
      - 412
      - 413
      - 414
      - 415
      - 416
      - 417
      - 418
      - 421
      - 422
      - 423
      - 424
      - 425
      - 426
      - 428
      - 429
      - 431
      - 451
      - 500
      - 501
      - 502
      - 503
      - 504
      - 505
      - 506
      - 507
      - 508
      - 510
      - 511
      title: HTTPStatus
      description: "HTTP status codes and reason phrases\n\nStatus codes from the\
        \ following RFCs are all observed:\n\n    * RFC 7231: Hypertext Transfer Protocol\
        \ (HTTP/1.1), obsoletes 2616\n    * RFC 6585: Additional HTTP Status Codes\n\
        \    * RFC 3229: Delta encoding in HTTP\n    * RFC 4918: HTTP Extensions for\
        \ WebDAV, obsoletes 2518\n    * RFC 5842: Binding Extensions to WebDAV\n \
        \   * RFC 7238: Permanent Redirect\n    * RFC 2295: Transparent Content Negotiation\
        \ in HTTP\n    * RFC 2774: An HTTP Extension Framework\n    * RFC 7725: An\
        \ HTTP Status Code to Report Legal Obstacles\n    * RFC 7540: Hypertext Transfer\
        \ Protocol Version 2 (HTTP/2)\n    * RFC 2324: Hyper Text Coffee Pot Control\
        \ Protocol (HTCPCP/1.0)\n    * RFC 8297: An HTTP Status Code for Indicating\
        \ Hints\n    * RFC 8470: Using Early Data in HTTP"
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Task:
      properties:
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
        status:
          $ref: '#/components/schemas/TaskStatusEnum'
        estimated_time:
          type: number
          title: Estimated Time
        desired_completion_date:
          type: string
          format: date-time
          title: Desired Completion Date
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        assignee:
          anyOf:
          - type: string
          - type: 'null'
          title: Assignee
      type: object
      required:
      - title
      - description
      - status
      - estimated_time
      - desired_completion_date
      title: Task
    TaskFailure:
      properties:
        reason:
          type: string
          title: Reason
        status:
          $ref: '#/components/schemas/HTTPStatus'
      type: object
      required:
      - reason
      - status
      title: TaskFailure
    TaskId:
      properties:
        id:
          type: integer
          title: Id
      type: object
      required:
      - id
      title: TaskId
    TaskStatusEnum:
      type: string
      enum:
      - OPEN
      - IN_PROGRESS
      - BLOCKED
      - COMPLETED
      title: TaskStatusEnum
    User:
      properties:
        role:
          type: string
          title: Role
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
        context_field:
          anyOf:
          - type: string
          - type: 'null'
          title: Context Field
      type: object
      required:
      - role
      - first_name
      - last_name
      title: User
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
